[package]
name = "playvortex_companion"
version = "0.1.0"
description = "PlayVortex Companion desktop client"
authors = ["Your Name"]
license = "MIT"
repository = "https://github.com/kristyan-bob/vortex-hack"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
